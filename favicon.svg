<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" role="img" aria-label="Software Development — A Guided Tour">
  <!-- Deep ocean background, rounded square -->
  <rect width="64" height="64" rx="14" ry="14" fill="#0A2A43"/>

  <!-- Subtle teal accent in top-right corner -->
  <circle cx="60" cy="6" r="14" fill="#1C7293" opacity="0.55"/>

  <!-- Left angle bracket  </ -->
  <path d="M 24 20 L 12 32 L 24 44"
        stroke="#CADCFC" stroke-width="5.5"
        stroke-linecap="round" stroke-linejoin="round" fill="none"/>

  <!-- Right angle bracket  /> -->
  <path d="M 40 20 L 52 32 L 40 44"
        stroke="#CADCFC" stroke-width="5.5"
        stroke-linecap="round" stroke-linejoin="round" fill="none"/>

  <!-- Gold accent slash through the middle -->
  <line x1="38" y1="14" x2="26" y2="50"
        stroke="#F2A541" stroke-width="5"
        stroke-linecap="round"/>
</svg>
